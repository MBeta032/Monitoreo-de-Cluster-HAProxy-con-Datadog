# variante B: pausas aleatorias de 1 a 3 segundos entre acciones.
# Mismas fases y mismas peticiones que pausas-sin.yml; solo cambia la pausa.
# La pausa aleatoria la hace pausas.js (también registra la pausa real en la métrica pausa.ms).
config:
  target: "http://haproxy:8080"
  processor: "./pausas.js"
  phases:
    - duration: 30
      arrivalRate: 1
      rampTo: 3
      name: "calentamiento"
    - duration: 240
      arrivalRate: 3
      name: "carga estable"
  plugins:
    publish-metrics:
      - type: datadog
        host: datadog-agent
        port: 8125
        prefix: "artillery."
        tags:
          - "test:pausas-1a3"
        event:
          title: "Artillery pausas-1a3"
          text: "Criterio 6: usuarios con pausas de 1 a 3 s entre acciones"
          priority: normal
          tags:
            - "test:pausas-1a3"
    metrics-by-endpoint:
      useOnlyRequestNames: true

scenarios:
  - name: "usuario_con_pausas_1a3"
    flow:
      - post:
          url: "/api/login"
          name: "login"
          json:
            email: "demo@taquilla.test"
            password: "Taquilla2026!"
      - loop:
          - get:
              url: "/api/events"
              name: "cartelera"
          - function: "pausaAleatoria"
          - get:
              url: "/api/events/1"
              name: "evento"
          - function: "pausaAleatoria"
          - get:
              url: "/api/events/1/seats?section=Platea"
              name: "sillas_zona"
          - function: "pausaAleatoria"
        count: 4