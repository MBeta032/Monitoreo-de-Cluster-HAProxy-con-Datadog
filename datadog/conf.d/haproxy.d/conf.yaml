init_config: {}

instances:
  - url: unix:///var/lib/haproxy/admin.sock
    use_openmetrics: false
    use_prometheus: false
    enable_service_check: true
    collect_status_metrics: true
    disable_legacy_service_tag: true
    # El Agent lee la planilla de HAProxy cada 5 s (por defecto son 15 s).
    # Así la caída de un backend se ve en Datadog en unos 5 a 10 s.
    min_collection_interval: 5
