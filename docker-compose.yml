# docker-compose.yml - Proyecto 8: Monitoreo de clúster HAProxy con Datadog
# Regla del grupo: cada integrante edita SOLO el bloque de su servicio.
# Nombres de servicios, puertos, red y volumen son parte del contrato (README, sección 5).

name: haproxy-telematicos

services:

  # --- haproxy (Manuel) ---
  haproxy:
    image: haproxy:2.6
    container_name: haproxy
    hostname: haproxy
    ports:
      - "8080:8080"
      - "127.0.0.1:8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - haproxy-socket:/var/lib/haproxy
    depends_on:
      - backend1
      - backend2
      - backend3
    labels:
      com.datadoghq.ad.logs: '[{"source":"haproxy","service":"haproxy"}]'
    networks:
      - cluster-net 
  
  # --- backends (Esteban) ---
  # Los tres usan la misma imagen. No cambiar nombres, hostname ni el puerto 5000.
  # Límites por backend: 1 CPU y 384 MB (Compose v2 aplica deploy.resources sin Swarm).
  backend1:
    build: ./backends
    image: haproxy-telematicos-backend:2.0.0
    restart: unless-stopped
    container_name: backend1
    hostname: backend1
    environment:
      INSTANCE_NAME: backend1
      PORT: 5000
      WEB_CONCURRENCY: ${BACKEND1_WORKERS:-2}
      # Conexión a PostgreSQL con las variables estándar de libpq
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-boleteria}
      PGUSER: ${POSTGRES_USER:-boleteria}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env (ver .env.example)}
      # Firma la cookie de sesión: la MISMA en los 3 backends para que todos reconozcan la sesión
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env (ver .env.example)}
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"backend1"}]'
    networks:
      - cluster-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 384M

  backend2:
    build: ./backends
    image: haproxy-telematicos-backend:2.0.0
    restart: unless-stopped
    container_name: backend2
    hostname: backend2
    environment:
      INSTANCE_NAME: backend2
      PORT: 5000
      WEB_CONCURRENCY: ${BACKEND2_WORKERS:-2}
      # Conexión a PostgreSQL con las variables estándar de libpq
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-boleteria}
      PGUSER: ${POSTGRES_USER:-boleteria}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env (ver .env.example)}
      # Firma la cookie de sesión: la MISMA en los 3 backends para que todos reconozcan la sesión
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env (ver .env.example)}
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"backend2"}]'
    networks:
      - cluster-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 384M

  backend3:
    build: ./backends
    image: haproxy-telematicos-backend:2.0.0
    restart: unless-stopped
    container_name: backend3
    hostname: backend3
    environment:
      INSTANCE_NAME: backend3
      PORT: 5000
      WEB_CONCURRENCY: ${BACKEND3_WORKERS:-2}
      # Conexión a PostgreSQL con las variables estándar de libpq
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-boleteria}
      PGUSER: ${POSTGRES_USER:-boleteria}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env (ver .env.example)}
      # Firma la cookie de sesión: la MISMA en los 3 backends para que todos reconozcan la sesión
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env (ver .env.example)}
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"backend3"}]'
    networks:
      - cluster-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 384M

  # --- db (Esteban) ---
  # Base de datos de la boletería. El puerto 5432 no se publica: solo la usan los backends por cluster-net.
  # Los scripts de ./db/init corren una sola vez, cuando el volumen pg-data está vacío.
  db:
    image: postgres:17.11
    restart: unless-stopped
    container_name: db
    hostname: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boleteria}
      POSTGRES_USER: ${POSTGRES_USER:-boleteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env (ver .env.example)}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Se consulta por TCP (-h 127.0.0.1): mientras corren los scripts de init, PostgreSQL
    # solo escucha por socket local, así que no queda healthy antes de terminar de cargar los datos.
    # $$ hace que la variable la lea el contenedor y no Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - cluster-net

  # --- datadog-agent (Jhon) ---
  datadog-agent:
    image: registry.datadoghq.com/agent:7.85.1
    container_name: datadog-agent
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE}
      DD_HOSTNAME: haproxy-telematicos-lab
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "false"
    group_add:
      - "99"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - haproxy-socket:/var/lib/haproxy:ro
      - ./datadog/datadog.yaml:/etc/datadog-agent/datadog.yaml:ro
      - ./datadog/conf.d/haproxy.d/conf.yaml:/etc/datadog-agent/conf.d/haproxy.d/conf.yaml:ro
      - ./datadog/conf.d/openmetrics.d/conf.yaml:/etc/datadog-agent/conf.d/openmetrics.d/conf.yaml:ro
    networks:
      - cluster-net

  # --- artillery (Juan José) ---

networks:
  cluster-net:
    name: cluster-net

volumes:
  # Cajón compartido donde HAProxy deja su socket y el Datadog Agent lo lee.
  haproxy-socket:
    name: haproxy-socket
  # Datos de PostgreSQL (eventos y sillas). Se conservan aunque se borren los contenedores.
  pg-data:
    name: pg-data
