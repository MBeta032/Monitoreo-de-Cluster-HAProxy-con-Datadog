# docker-compose.yml - Proyecto 8: Monitoreo de clúster HAProxy con Datadog
# Regla del grupo: cada integrante edita SOLO el bloque de su servicio.
# Nombres de servicios, puertos, red y volumen son parte del contrato (README, sección 5).

name: haproxy-telematicos

services:

  # --- haproxy (Manuel) ---
  haproxy:
    image: haproxy:2.6
    container_name: haproxy
    hostname: haproxy
    ports:
      - "8080:8080"
      - "127.0.0.1:8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - haproxy-socket:/var/lib/haproxy
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - cluster-net 
  
  # --- backends (Esteban) ---
  # TEMPORALES: imagen traefik/whoami, solo para probar HAProxy mientras llegan los reales.
  # Esteban cambia "image" por sus backends. No cambiar nombres, hostname ni el puerto 5000.
  backend1:
    build: ./backends
    container_name: backend1
    hostname: backend1
    environment:
      INSTANCE_NAME: backend1
      PORT: 5000
    networks:
      - cluster-net

  backend2:
    build: ./backends
    container_name: backend2
    hostname: backend2
    environment:
      INSTANCE_NAME: backend2
      PORT: 5000
    networks:
      - cluster-net

  backend3:
    build: ./backends
    container_name: backend3
    hostname: backend3
    environment:
      INSTANCE_NAME: backend3
      PORT: 5000
    networks:
      - cluster-net

  # --- datadog-agent (Jhon) ---

  # --- artillery (Juan José) ---

  artillery:
    image: artilleryio/artillery:2.0.34
    container_name: artillery
    profiles: ["pruebas"]
    working_dir: /scripts
    volumes:
      - ./artillery:/scripts
    networks:
      - cluster-net

networks:
  cluster-net:
    name: cluster-net

volumes:
  # Cajón compartido donde HAProxy deja su socket y el Datadog Agent lo lee.
  haproxy-socket:
    name: haproxy-socket
