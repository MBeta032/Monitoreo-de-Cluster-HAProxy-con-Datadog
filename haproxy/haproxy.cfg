global
    log stdout format raw local0
    stats socket /var/lib/haproxy/admin.sock mode 660 level user

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend fe_web
    bind *:8080
    log global
    option httplog
    default_backend be_app

frontend fe_stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-desc Cluster HAProxy - Proyecto 8 - Servicios Telematicos
    stats show-legends

backend be_app
    balance roundrobin
    option redispatch 1
    option httpchk GET /health
    http-check expect status 200
    server backend1 backend1:5000 check inter 1s fall 3 rise 2
    server backend2 backend2:5000 check inter 1s fall 3 rise 2
    server backend3 backend3:5000 check inter 1s fall 3 rise 2
