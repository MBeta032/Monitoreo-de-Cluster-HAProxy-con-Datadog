global
    log stdout len 4096 format raw local0
    stats socket /var/lib/haproxy/admin.sock mode 660 level user

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend fe_web
    bind *:8080
    log global
    http-request set-var(txn.path) path,bytes(0,512)
    http-request set-var(txn.method) method,bytes(0,32)
    log-format '{"timestamp":%[date(0,ms)],"client_ip":"%ci","frontend":"%f","backend":"%b","server":"%s","method":"%[var(txn.method),json(utf8s)]","path":"%[var(txn.path),json(utf8s)]","status_code":%ST,"bytes":%B,"queue_ms":%Tw,"connect_ms":%Tc,"response_ms":%Tr,"total_ms":%Ta,"termination_state":"%ts","retries":"%rc"}'
    default_backend be_app

frontend fe_stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-desc Cluster HAProxy - Proyecto 8 - Servicios Telematicos
    stats show-legends

backend be_app
    balance roundrobin
    option redispatch 1
    option httpchk GET /health
    http-check expect status 200
    server backend1 backend1:5000 check inter 1s fall 3 rise 2
    server backend2 backend2:5000 check inter 1s fall 3 rise 2
    server backend3 backend3:5000 check inter 1s fall 3 rise 2
